name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Verify release tag and package versions
      if: github.event_name == 'release'
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        python - <<'PY'
        import ast
        import os
        import pathlib
        import sys
        import tomllib

        root = pathlib.Path(".")
        pyproject_data = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))
        pyproject_version = pyproject_data["project"]["version"]

        init_text = (root / "ytlookup" / "__init__.py").read_text(encoding="utf-8")
        init_tree = ast.parse(init_text)
        init_version = None
        for node in init_tree.body:
            if isinstance(node, ast.Assign):
                for target in node.targets:
                    if isinstance(target, ast.Name) and target.id == "__version__":
                        if isinstance(node.value, ast.Constant) and isinstance(node.value.value, str):
                            init_version = node.value.value
                        break
            if init_version is not None:
                break

        if init_version is None:
            print("Could not find __version__ string assignment in ytlookup/__init__.py")
            sys.exit(1)

        release_tag = os.environ["RELEASE_TAG"]
        normalized_tag = release_tag[1:] if release_tag.startswith("v") else release_tag

        errors = []
        if pyproject_version != init_version:
            errors.append(
                f"Version mismatch: pyproject.toml={pyproject_version}, ytlookup.__version__={init_version}"
            )
        if normalized_tag != pyproject_version:
            errors.append(
                f"Tag mismatch: release tag={release_tag} (normalized={normalized_tag}), package version={pyproject_version}"
            )

        if errors:
            for error in errors:
                print(error)
            sys.exit(1)

        print(f"Version check passed: tag={release_tag}, version={pyproject_version}")
        PY
    
    - name: Build package
      run: python -m build
    
    - name: Check package
      run: twine check dist/*

    - name: Smoke test built package
      run: |
        python -m pip install dist/*.whl
        python -c "import ytlookup; print(f'Smoke test version: {ytlookup.__version__}')"

    - name: Upload distribution artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    
    - name: Publish package
      if: github.event_name == 'release'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
