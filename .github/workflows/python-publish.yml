name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
    - uses: actions/checkout@v5
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Verify release tag and package versions
      if: github.event_name == 'release'
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        python - <<'PY'
        import os
        import pathlib
        import sys
        import tomllib

        root = pathlib.Path(".")
        pyproject_data = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))
        pyproject_version = pyproject_data["project"]["version"]

        namespace = {}
        exec((root / "ytlookup" / "__init__.py").read_text(encoding="utf-8"), namespace)
        init_version = namespace.get("__version__")

        release_tag = os.environ["RELEASE_TAG"]
        normalized_tag = release_tag[1:] if release_tag.startswith("v") else release_tag

        errors = []
        if pyproject_version != init_version:
            errors.append(
                f"Version mismatch: pyproject.toml={pyproject_version}, ytlookup.__version__={init_version}"
            )
        if normalized_tag != pyproject_version:
            errors.append(
                f"Tag mismatch: release tag={release_tag} (normalized={normalized_tag}), package version={pyproject_version}"
            )

        if errors:
            for error in errors:
                print(error)
            sys.exit(1)

        print(f"Version check passed: tag={release_tag}, version={pyproject_version}")
        PY
    
    - name: Build package
      run: python -m build
    
    - name: Check package
      run: twine check dist/*

    - name: Smoke test built package
      run: |
        python -m pip install dist/*.whl
        python -c "import ytlookup; print(f'Smoke test version: {ytlookup.__version__}')"

    - name: Upload distribution artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
